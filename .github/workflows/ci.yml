name: CI Quality Gate

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Typecheck, Lint & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Validate Database Schema (if present)
        run: |
          if [ -f "prisma/schema.prisma" ]; then
            npx prisma validate
            npx prisma generate
          fi
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://postgres:postgres@localhost:5432/test?sslmode=disable' }}

      - name: Type Check (TypeScript)
        run: |
          if [ -f "tsconfig.json" ]; then
            npx tsc --noEmit
          fi

      - name: Run Linter
        run: npm run lint --if-present

      - name: Run Automated Agent Health Check
        run: |
          if [ -f "scripts/agent-doctor.mjs" ]; then
            node scripts/agent-doctor.mjs
          fi
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://postgres:postgres@localhost:5432/test?sslmode=disable' }}

      - name: Run Unit / Component Tests
        run: npm test --if-present
        env:
          CI: "true"
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://postgres:postgres@localhost:5432/test?sslmode=disable' }}

      - name: Production Build
        run: npm run build --if-present
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://postgres:postgres@localhost:5432/test?sslmode=disable' }}
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET || 'ci_test_admin_secret_key_12345' }}
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'ci_test_jwt_secret_key_12345' }}
          NODE_ENV: "production"
